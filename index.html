<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ポップショット</title>
<!-- 文字の弾用のドット風フォント（OFL）。配布時はビルドで埋め込む -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
  html, body { height: 100%; }
  body {
    margin: 0; background: #0b0b12; overflow: hidden;
    overscroll-behavior: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    display: flex; align-items: center; justify-content: center;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    box-sizing: border-box;
  }
  canvas { display: block; touch-action: none; }
  #rotate {
    display: none; position: fixed; inset: 0; background: #0b0b12; color: #fff;
    font: 22px/1.6 "DotGothic16", monospace;
    align-items: center; justify-content: center; text-align: center;
  }
  @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="rotate">📱↻<br>横にしてください</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
